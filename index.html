  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at center, #1a1a1c 0%, #0a0a0b 100%);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    display: grid; place-items: center; padding: 16px;
    user-select: none; -webkit-user-select: none;
  }
  body.dog { background: #000 var(--dog) center / cover no-repeat fixed; }

  .win {
    width: min(300px, 100%);
    background: #1b1b1b; border: 1px solid #5a5a5a;
    box-shadow: 0 8px 30px rgba(0,0,0,.65); color: #fff;
    position: relative; z-index: 1;
  }
  .bar {
    background: #2e2e2e; height: 24px; padding: 0 8px;
    display: flex; align-items: center;
    font-size: 11px; color: #f0f0f0; border-bottom: 1px solid #3a3a3a;
  }
  .client {
    padding: 14px;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 8px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 8px),
      #1b1b1b;
  }
  h1 { margin: 4px 0 12px; text-align: center; font-size: 18px; font-weight: 700; font-style: italic; white-space: nowrap; }
  fieldset { margin: 0; padding: 10px 0 12px; border: 1px solid #e6e6e6; display: flex; justify-content: center; }
  legend { font-size: 10px; color: #fff; padding: 0 2px; margin-left: 2px; }
  button.btn {
    font: inherit; font-size: 11px; font-weight: 700; color: #fff;
    background: #000; border: 1px solid #000; width: 130px; height: 44px; cursor: pointer; border-radius: 0;
  }
  button.btn:hover:not(:disabled) { background: #0d0d0d; border-color: #444; }
  button.btn:active:not(:disabled) { background: #1a1a1a; }
  button.btn:focus-visible { outline: 1px dashed #fff; outline-offset: 2px; }
  button.btn:disabled { cursor: default; color: #ff4d4d; }


</style>
</head>
<body>
  <main class="win">
    <div class="client">
      <h1>fatdoghook.cc</h1>
      <fieldset>
        <legend>Options</legend>
        <button class="btn" id="buy" type="button">Buy</button>
      </fieldset>
    </div>
  </main>

<script>
(function () {
  var DOG = getComputedStyle(document.documentElement).getPropertyValue('--dog').trim();
  DOG = DOG.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
  var btn = document.getElementById('buy');

  /* ---------- earblaring beep ---------- */
  function beep() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    var ctx = new AC();
    if (ctx.state === 'suspended') ctx.resume();

    // everything is overdriven and hard-clipped so it sits at full scale
    var drive = ctx.createGain();
    drive.gain.value = 10;
    var clip = ctx.createWaveShaper();
    clip.curve = new Float32Array([-1, 1]);

    // harsh 60 Hz chop on top: amplitude flips between 35% and 100%
    var chop = ctx.createGain();
    chop.gain.value = 0.675;
    var chopLfo = ctx.createOscillator();
    chopLfo.type = 'square';
    chopLfo.frequency.value = 60;
    var chopDepth = ctx.createGain();
    chopDepth.gain.value = 0.325;
    chopLfo.connect(chopDepth);
    chopDepth.connect(chop.gain);

    drive.connect(clip);
    clip.connect(chop);
    chop.connect(ctx.destination);

    // two pitch modulators: a fast saw sweep plus a square warble
    var sweep = ctx.createOscillator();
    sweep.type = 'sawtooth';
    sweep.frequency.value = 9;
    var sweepDepth = ctx.createGain();
    sweepDepth.gain.value = 1300;
    sweep.connect(sweepDepth);

    var warble = ctx.createOscillator();
    warble.type = 'square';
    warble.frequency.value = 13;
    var warbleDepth = ctx.createGain();
    warbleDepth.gain.value = 500;
    warble.connect(warbleDepth);

    // clashing saw/square tones; the close pairs beat against each other
    [['sawtooth', 2600], ['square', 3150], ['square', 3330], ['sawtooth', 4100], ['square', 2475]].forEach(function (s) {
      var o = ctx.createOscillator();
      o.type = s[0];
      o.frequency.value = s[1];
      sweepDepth.connect(o.frequency);
      warbleDepth.connect(o.frequency);
      o.connect(drive);
      o.start();
    });

    // scraping hiss: looping white noise, high-passed
    var len = ctx.sampleRate * 2;
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    var noise = ctx.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;
    var hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 3500;
    var noiseGain = ctx.createGain();
    noiseGain.gain.value = 2;
    noise.connect(hp);
    hp.connect(noiseGain);
    noiseGain.connect(drive);

    sweep.start(); warble.start(); chopLfo.start(); noise.start();
  }

  /* ---------- real popup windows ---------- */
  function popupHTML(title) {
    return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + title + '</title><style>' +
      'html,body{margin:0;background:#1b1b1b;font-family:Segoe UI,Tahoma,Arial,sans-serif;overflow:hidden}' +
      '.bar{background:#2e2e2e;color:#f0f0f0;font-size:11px;height:22px;line-height:22px;padding:0 8px;border-bottom:1px solid #3a3a3a}' +
      '.pad{padding:6px}img{display:block;width:100%;height:auto;border:1px solid #000}' +
      '</style></head><body><div class="bar">' + title + '</div><div class="pad"><img alt="fatdoghook.cc" src="' + DOG + '"></div>' +
      '</body></html>';
  }

  function openReal(name, title, vx, vy, sx, sy) {
    var feat = 'popup=yes,width=240,height=360,left=' + Math.round(sx) + ',top=' + Math.round(sy);
    var p = null;
    try { p = window.open('', name, feat); } catch (e) {}
    if (!p || p.closed) return null;
    try {
      p.document.open();
      p.document.write(popupHTML(title));
      p.document.close();
    } catch (e) {}
    return p;
  }

  btn.addEventListener('click', function () {
    if (btn.disabled) return;
    btn.disabled = true;
    document.body.classList.add('dog');

    // open both popups synchronously inside the click so the browser allows them
    var sw = screen.availWidth, sh = screen.availHeight;
    var defs = [
      { n: 'fatdoghook', t: 'fatdoghook.cc', vx: 70, vy: 55, x: sw * 0.30, y: sh * 0.20 }
    ];
    var wins = [];
    defs.forEach(function (d) {
      var p = openReal(d.n, d.t, d.vx, d.vy, d.x, d.y);
      if (p) wins.push({ p: p, x: d.x, y: d.y, vx: d.vx, vy: d.vy });
    });

    function step() {
      var L = screen.availLeft || 0, T = screen.availTop || 0;
      var W = screen.availWidth, H = screen.availHeight;
      wins.forEach(function (o) {
        var w = 256, h = 420;
        try { if (o.p.closed) return; w = o.p.outerWidth || w; h = o.p.outerHeight || h; } catch (e) {}
        o.x += o.vx; o.y += o.vy;
        var hitX = false, hitY = false;
        if (o.x <= L) { o.x = L; o.vx = Math.abs(o.vx); hitX = true; }
        if (o.x + w >= L + W) { o.x = L + W - w; o.vx = -Math.abs(o.vx); hitX = true; }
        if (o.y <= T) { o.y = T; o.vy = Math.abs(o.vy); hitY = true; }
        if (o.y + h >= T + H) { o.y = T + H - h; o.vy = -Math.abs(o.vy); hitY = true; }
        // new random speed on every wall hit so it ricochets unpredictably
        if (hitX) o.vx = (o.vx < 0 ? -1 : 1) * (45 + Math.random() * 60);
        if (hitY) o.vy = (o.vy < 0 ? -1 : 1) * (40 + Math.random() * 55);
        try { o.p.moveTo(Math.round(o.x), Math.round(o.y)); } catch (e) {}
      });
    }

    var started = false;
    function useInterval() { if (!started) { started = true; setInterval(step, 10); } }
    try {
      var blob = new Blob(['setInterval(function(){postMessage(0)},10)'], { type: 'text/javascript' });
      var wk = new Worker(URL.createObjectURL(blob));
      wk.onmessage = step;
      wk.onerror = useInterval;
    } catch (e) { useInterval(); }

    beep();
  });
})();
</script>
