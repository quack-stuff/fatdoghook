<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fatdoghook.cc</title>
<style>
  /* Put dog.jpg next to this file, or paste your original data: URI back in here. */
  :root { --dog: url("dog.jpg"); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at center, #1a1a1c 0%, #0a0a0b 100%);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    display: grid; place-items: center; padding: 16px;
    user-select: none; -webkit-user-select: none;
  }
  body.dog { background: #000 var(--dog) center / cover no-repeat fixed; }

  .win {
    width: min(300px, 100%);
    background: #1b1b1b; border: 1px solid #5a5a5a;
    box-shadow: 0 8px 30px rgba(0,0,0,.65); color: #fff;
    position: relative; z-index: 1;
  }
  .bar {
    background: #2e2e2e; height: 24px; padding: 0 8px;
    display: flex; align-items: center;
    font-size: 11px; color: #f0f0f0; border-bottom: 1px solid #3a3a3a;
  }
  .client {
    padding: 14px;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 8px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 8px),
      #1b1b1b;
  }
  h1 { margin: 4px 0 12px; text-align: center; font-size: 18px; font-weight: 700; font-style: italic; white-space: nowrap; }
  fieldset { margin: 0; padding: 10px 0 12px; border: 1px solid #e6e6e6; display: flex; justify-content: center; }
  legend { font-size: 10px; color: #fff; padding: 0 2px; margin-left: 2px; }
  button.btn {
    font: inherit; font-size: 11px; font-weight: 700; color: #fff;
    background: #000; border: 1px solid #000; width: 130px; height: 44px; cursor: pointer; border-radius: 0;
  }
  button.btn:hover:not(:disabled) { background: #0d0d0d; border-color: #444; }
  button.btn:active:not(:disabled) { background: #1a1a1a; }
  button.btn:focus-visible { outline: 1px dashed #fff; outline-offset: 2px; }
  button.btn:disabled { cursor: default; color: #ff4d4d; }
</style>
</head>
<body>
  <main class="win">
    <div class="client">
      <h1>fatdoghook.cc</h1>
      <fieldset>
        <legend>Options</legend>
        <button class="btn" id="buy" type="button">Buy</button>
      </fieldset>
    </div>
  </main>

<script>
(function () {
  var DOG = getComputedStyle(document.documentElement).getPropertyValue('--dog').trim();
  DOG = DOG.replace(/^url\(["']?/, '').replace(/["']?\)$/, '');
  if (!/^data:/.test(DOG)) DOG = new URL(DOG, location.href).href;
  var MP3 = new URL('burgers.mp3', location.href).href;
  var btn = document.getElementById('buy');

  var START = 3;        // windows on first click
  var PER_CLOSE = 2;    // heads grown per closed window
  var MAX_ALIVE = 9;    // cap on windows open at once
  var MAX_TOTAL = 30;   // cap on windows spawned overall
  var SPEED = 0.5;      // speed multiplier (1 = original speed)

  var wins = [], total = 0, counter = 0;

  function popupHTML(title) {
    return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + title + '</title><style>' +
      'html,body{margin:0;background:#1b1b1b;font-family:Segoe UI,Tahoma,Arial,sans-serif;overflow:hidden}' +
      '.bar{background:#2e2e2e;color:#f0f0f0;font-size:11px;height:22px;line-height:22px;padding:0 8px;border-bottom:1px solid #3a3a3a}' +
      '.pad{padding:6px}img{display:block;width:100%;height:auto;border:1px solid #000}' +
      '</style></head><body><div class="bar">' + title + '</div><div class="pad"><img alt="fatdoghook.cc" src="' + DOG + '"></div>' +
      '<audio id="a" src="' + MP3 + '" autoplay loop></audio>' +
      '<script>document.addEventListener("click",function(){var a=document.getElementById("a");if(a.paused)a.play();});<\/script>' +
      '</body></html>';
  }

  function spawn() {
    if (wins.length >= MAX_ALIVE || total >= MAX_TOTAL) return;
    var sw = screen.availWidth, sh = screen.availHeight;
    var x = Math.random() * (sw - 260), y = Math.random() * (sh - 430);
    var p = null;
    try { p = window.open('', 'fdh' + (counter++), 'popup=yes,width=240,height=360,left=' + Math.round(x) + ',top=' + Math.round(y)); } catch (e) {}
    if (!p || p.closed) return;   // blocked by the browser: nothing more we do
    try { p.document.open(); p.document.write(popupHTML('fatdoghook.cc')); p.document.close(); } catch (e) {}
    total++;
    wins.push({
      p: p, x: x, y: y,
      vx: (Math.random() < 0.5 ? -1 : 1) * (45 + Math.random() * 40) * SPEED,
      vy: (Math.random() < 0.5 ? -1 : 1) * (40 + Math.random() * 40) * SPEED
    });
  }

  function step() {
    var L = screen.availLeft || 0, T = screen.availTop || 0;
    var W = screen.availWidth, H = screen.availHeight;
    var grow = 0;

    wins = wins.filter(function (o) {
      var closed = false;
      try { closed = o.p.closed; } catch (e) { closed = true; }
      if (closed) { grow += PER_CLOSE; return false; }
      return true;
    });

    wins.forEach(function (o) {
      var w = 256, h = 420;
      try { w = o.p.outerWidth || w; h = o.p.outerHeight || h; } catch (e) {}
      o.x += o.vx; o.y += o.vy;
      var hitX = false, hitY = false;
      if (o.x <= L) { o.x = L; o.vx = Math.abs(o.vx); hitX = true; }
      if (o.x + w >= L + W) { o.x = L + W - w; o.vx = -Math.abs(o.vx); hitX = true; }
      if (o.y <= T) { o.y = T; o.vy = Math.abs(o.vy); hitY = true; }
      if (o.y + h >= T + H) { o.y = T + H - h; o.vy = -Math.abs(o.vy); hitY = true; }
      if (hitX) o.vx = (o.vx < 0 ? -1 : 1) * (45 + Math.random() * 60) * SPEED;
      if (hitY) o.vy = (o.vy < 0 ? -1 : 1) * (40 + Math.random() * 55) * SPEED;
      try { o.p.moveTo(Math.round(o.x), Math.round(o.y)); } catch (e) {}
    });

    for (var i = 0; i < grow; i++) spawn();
  }

  btn.addEventListener('click', function () {
    if (btn.disabled) return;
    btn.disabled = true;
    document.body.classList.add('dog');

    // main tab plays the song too (the click counts as the user gesture autoplay needs)
    var song = new Audio(MP3);
    song.loop = true;
    song.addEventListener('error', function () {
      var c = song.error ? song.error.code : '?';
      document.title = 'burgers.mp3 failed (code ' + c + ')';
      console.error('burgers.mp3 failed to load:', MP3, song.error);
    });
    song.play().catch(function (e) {
      document.title = 'play blocked: ' + e.name;
      console.error('play() rejected:', e);
    });

    for (var i = 0; i < START; i++) spawn();   // inside the click so the browser allows it

    var started = false;
    function useInterval() { if (!started) { started = true; setInterval(step, 10); } }
    try {
      var blob = new Blob(['setInterval(function(){postMessage(0)},10)'], { type: 'text/javascript' });
      var wk = new Worker(URL.createObjectURL(blob));
      wk.onmessage = step;
      wk.onerror = useInterval;
    } catch (e) { useInterval(); }
  });
})();
</script>
</body>
</html>
